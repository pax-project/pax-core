name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bump level comes from the squash-merge commit, in this repo's own
      # `type(area): description` convention — e.g. "feature(sync): add pax
      # sync" or "fix(library): correct round-trip". `feature` -> minor,
      # `fix` -> patch, a `!` before the colon or a `BREAKING CHANGE:` footer
      # -> major (regardless of type). Anything else (chore, docs, refactor,
      # ...) or no match at all -> no release, so routine commits stay silent.
      - name: Determine version bump from commit message
        id: bump
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          first_line=$(head -n1 <<< "$COMMIT_MESSAGE")
          type=$(sed -E 's/^([a-zA-Z]+)(\([^)]*\))?!?:.*/\1/' <<< "$first_line" | tr '[:upper:]' '[:lower:]')

          if grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<< "$first_line" \
            || grep -qiE '^BREAKING[ -]CHANGE:' <<< "$COMMIT_MESSAGE"; then
            level="major"
          elif [ "$type" = "feature" ] || [ "$type" = "feat" ]; then
            level="minor"
          elif [ "$type" = "fix" ]; then
            level="patch"
          else
            level="none"
          fi
          echo "level=$level" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.bump.outputs.level != 'none'
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        if: steps.bump.outputs.level != 'none'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Compute next version
        if: steps.bump.outputs.level != 'none'
        id: nextver
        run: |
          current=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          IFS=. read -r major minor patch <<< "$current"
          case "${{ steps.bump.outputs.level }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Bump Cargo.toml / Cargo.lock
        if: steps.bump.outputs.level != 'none'
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${{ steps.nextver.outputs.version }}\"/" Cargo.toml
          cargo check --quiet

      - name: Commit, tag, and push
        if: steps.bump.outputs.level != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${{ steps.nextver.outputs.version }} [skip release]"
          git tag "${{ steps.nextver.outputs.version }}"
          git push origin main --follow-tags

      - name: Build release binary
        if: steps.bump.outputs.level != 'none'
        run: |
          cargo build --release
          tar czf "pax-${{ steps.nextver.outputs.version }}-x86_64-linux.tar.gz" -C target/release pax

      - name: Publish to crates.io
        if: steps.bump.outputs.level != 'none'
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Create GitHub release
        if: steps.bump.outputs.level != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.nextver.outputs.version }}" \
            "pax-${{ steps.nextver.outputs.version }}-x86_64-linux.tar.gz" \
            --title "${{ steps.nextver.outputs.version }}" \
            --generate-notes
