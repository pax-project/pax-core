[package]
name = "pax-core-papers"
version = "3.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Discover, declare, manage, and reproducibly acquire academic papers, using Nix as the artifact backend."
repository = "https://github.com/pax-project/pax-core"
readme = "README.md"

[lib]
name = "pax_core"
path = "src/lib.rs"

[[bin]]
name = "pax"
path = "src/bin/pax/main.rs"
required-features = ["cli"]

# Runs the built `pax` binary, so it needs the CLI.
[[test]]
name = "cli"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:dotenvy", "tokio/macros", "tokio/rt-multi-thread"]
# Derives `schemars::JsonSchema` on the `output` shapes and `Stats`, for a
# client that publishes their schema (e.g. an MCP server).
schemars = ["dep:schemars"]

[dependencies]
arxiv-tools = "2.0.0"
# clock: the search log dates its entries.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.6", features = ["derive"], optional = true }
crossref = { package = "crossref-async", version = "0.3.1" }
# dblp record exports (`/rec/<key>.xml`); already in the tree through arxiv-tools.
quick-xml = "0.41"
dotenvy = { version = "0.15.7", optional = true }
papers-openalex = "0.3.1"
# HTTPS for the Semantic Scholar list requests; default-tls is the TLS
# backend semantic-scholar-rs already pulls into this same reqwest.
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }
schemars = { version = "1", optional = true }
semantic-scholar-rs = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
# The library needs only the timer, to back off when Semantic Scholar rate-limits.
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
# A runtime with a timer, for the tests that wait on a real pacer.
tokio = { version = "1", features = ["macros", "rt", "time"] }
